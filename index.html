<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0e1116" />
  <title>Sri Lankan Politics — Controversy Archive</title>
  <meta name="description" content="A curated, source-linked archive of the most contested episodes in modern Sri Lankan politics." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e1116'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23f5c518' font-family='sans-serif' font-weight='bold'%3E%E2%9A%96%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Sri Lankan Politics <span class="accent">Controversy Archive</span></h1>
      <p class="tagline" id="tagline">Loading…</p>
    </div>
  </header>

  <main class="wrap">
    <section class="disclaimer" id="disclaimer" aria-live="polite"></section>

    <section class="controls" aria-label="Filters">
      <div class="search-box">
        <input type="search" id="search" placeholder="Search topics, people, events…" aria-label="Search the archive" />
      </div>
      <div class="filter-row">
        <div class="filters" id="category-filters" role="group" aria-label="Filter by category"></div>
        <div class="sort">
          <label for="sort-select">Sort</label>
          <select id="sort-select">
            <option value="controversy">Most controversial</option>
            <option value="chrono">Chronological</option>
            <option value="title">A–Z</option>
          </select>
        </div>
      </div>
      <p class="result-count" id="result-count"></p>
    </section>

    <section class="grid" id="topic-grid" aria-live="polite"></section>
    <p class="empty" id="empty-state" hidden></p>
  </main>

  <!-- Detail modal -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <article class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-content" id="modal-content"></div>
    </article>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-meta"></p>
      <p class="footer-note">Educational research aid. Read every source critically. Multiple viewpoints are presented by design.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
